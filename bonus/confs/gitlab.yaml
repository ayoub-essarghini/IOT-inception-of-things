apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        - containerPort: 22
          name: ssh
        env:
        - name: GITLAB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitlab-root-password
              key: password
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://gitlab.gitlab.svc.cluster.local'
            nginx['listen_port'] = 80
            nginx['listen_https'] = false
            gitlab_rails['gitlab_shell_ssh_port'] = 30222
            gitlab_rails['registry_enabled'] = false
            prometheus_monitoring['enable'] = false
            # Trim memory so GitLab fits in a constrained host without being
            # OOM-killed: run Puma single-process (no cluster workers) and keep
            # Sidekiq/Postgres small. This drops idle RSS from ~10GB to ~3GB.
            puma['worker_processes'] = 0
            sidekiq['max_concurrency'] = 3
            postgresql['shared_buffers'] = "256MB"
            postgresql['max_worker_processes'] = 4
        readinessProbe:
          httpGet:
            path: /users/sign_in
            port: 80
          initialDelaySeconds: 180
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 40
        resources:
          requests:
            cpu: "1"
            memory: "3Gi"
          limits:
            cpu: "3"
            memory: "6Gi"
        volumeMounts:
        - name: gitlab-data
          mountPath: /var/opt/gitlab
      volumes:
      - name: gitlab-data
        persistentVolumeClaim:
          claimName: gitlab-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  type: ClusterIP
  selector:
    app: gitlab
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  - name: ssh
    protocol: TCP
    port: 22
    targetPort: 22
